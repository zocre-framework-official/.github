name: Feature request
description: Suggest an improvement for a public ZOcre product or package.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: product
    attributes:
      label: Product / package
      options:
        - ZOcre Control
        - ZOcre Framework
        - Other public ZOcre package
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Problem or need
      description: Explain the user problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user-facing behavior, without private implementation details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
