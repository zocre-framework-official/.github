name: Bug report
description: Report a reproducible problem in a public ZOcre product or package.
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: product
    attributes:
      label: Product / package
      options:
        - ZOcre Control
        - Other public ZOcre package
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Example: 1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS / NANOS version / relevant platform information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear, minimal and reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, private addresses, personal data, player data and infrastructure details.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safe confirmation
      options:
        - label: I removed secrets, private ZOcre material and sensitive data from this report.
          required: true
